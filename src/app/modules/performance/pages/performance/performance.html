<div class="min-h-screen bg-[#004aad] text-white px-4 py-6">

  <header class="mb-6">
    <img src="/images/OPX_logo_escuro.png" alt="Logomarca do sistema" class="max-w-full h-auto mx-auto">
    <h1 class="text-2xl font-bold">
      Fevereiro 2026
    </h1>
    <p class="text-sm text-neutral-400">
      Performance Semanal
    </p>
  </header>

  <section>
    <app-week-hero
        *ngIf="currentWeek as week"
        [week]="week">
    </app-week-hero>

    <section *ngFor="let month of months">
        <app-month-summary
            [weeks]="month.weeks"
            [monthName]="month.monthName"
            [monthlyGoal]="8000">
        </app-month-summary>
    </section>


  </section>

</div>
