<div class="min-h-screen bg-neutral-950 text-white px-4 py-6">

  <header class="mb-6">
    <img src="/images/sflim.png" alt="Logomarca do sistema">
    <h1 class="text-2xl font-bold">
      Fevereiro 2026
    </h1>
    <p class="text-sm text-neutral-400">
      Performance Semanal
    </p>
  </header>

  <section>
    <app-week-hero
        *ngIf="currentWeek"
        [points]="currentWeek.points"
        [result]="currentWeek.result"
        [goal]="currentWeek.goal"
        [protection]="currentWeek.protection"
        [weekStart]="currentWeek.weekStart"
        [weekEnd]="currentWeek.weekEnd"
    />

  </section>

</div>
