<div class="min-h-screen bg-[#004aad] text-white px-4 py-6">

  <header class="mb-6">
    <img src="/images/OPX_logo_escuro.png" alt="Logomarca do sistema" class="max-w-full h-auto mx-auto">
    <h1 class="text-2xl font-bold">
      {{currentMonth?.monthName}}
    </h1>
    <p class="text-sm text-neutral-400">
      Performance Semanal
    </p>
  </header>


  <section  *ngIf="currentWeek as week">
    <app-week-hero [week]="week"></app-week-hero>
  </section>
  <section class="mt-8">
  <div *ngIf="currentMonth as month">

    <div class="flex items-center justify-between mb-6">
      <button
        (click)="goToPreviousMonth()"
        [disabled]="selectedMonthIndex === 0"
        class="px-4 py-2 bg-gray-800 text-white rounded-lg disabled:opacity-30 hover:bg-gray-700 transition-colors">
        ←
      </button>

      <div class="text-center">
        <h2 class="text-xl font-black uppercase tracking-widest text-white">
          {{ month.monthName }}
        </h2>
        <span class="text-[10px] text-blue-400 font-bold uppercase">Relatório de Performance</span>
      </div>

      <button
        (click)="goToNextMonth()"
        [disabled]="selectedMonthIndex === months.length - 1"
        class="px-4 py-2 bg-gray-800 text-white rounded-lg disabled:opacity-30 hover:bg-gray-700 transition-colors">
        →
      </button>
    </div>

    <app-month-summary
      [weeks]="month.weeks"
      [monthName]="month.monthName"
      [monthlyGoal]="8000">
    </app-month-summary>

  </div>
</section>
  <section *ngIf="days.length > 0">
    <app-best-weekday [days]="days"></app-best-weekday>
  </section>

  

</div>
