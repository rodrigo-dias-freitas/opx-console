<div class="bg-gray-800/50 rounded-xl p-5 border border-white/10 mt-6">
  <div class="flex items-center gap-3 mb-4">
    <span class="p-2 bg-yellow-500 rounded-lg text-black">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    </span>
    <div>
      <h3 class="text-sm text-neutral-400 uppercase tracking-tighter">Melhor Dia para Operar</h3>
      <p class="text-xl font-bold text-white" *ngIf="bestDay">
        {{ bestDay.name }}
      </p>
    </div>
  </div>

  <div class="space-y-3">
    <div *ngFor="let day of weekdays" class="flex items-center justify-between group">
      <span class="text-neutral-300">{{ day.name }}</span>
      <div class="flex items-center gap-4">
        <span class="text-xs text-neutral-500">{{ day.tradeCount }} dias op.</span>
        <span [ngClass]="day.totalResult >= 0 ? 'text-green-400' : 'text-red-400'" class="font-mono font-medium">
          {{ day.totalResult | currency:'BRL' }}
        </span>
      </div>
    </div>
  </div>
  
  <p class="text-[10px] text-neutral-500 mt-4 text-center italic">
    * Dados baseados na sua leitura de CSV do Profit Pro
  </p>
</div>
